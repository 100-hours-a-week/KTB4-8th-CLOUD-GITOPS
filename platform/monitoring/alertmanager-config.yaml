# 서비스 알림 전달(5-5, WBS 18). keepgo-app 차트의 PrometheusRule 알림(KeepgoPodRestarting 등)을 Discord로 보낸다.
# Prometheus·Alertmanager 설치는 A 담당이고, 여기서는 B가 만든 알림의 전달 경로만 둔다.
#
# [가정·A 계약]
#   1) Alertmanager가 이 Namespace(monitoring)의 AlertmanagerConfig를 읽는다(kube-prometheus-stack 기본 selector).
#   2) Alertmanager의 alertmanagerConfigMatcherStrategy.type = None.
#      기본값(OnNamespace)이면 이 설정이 monitoring Namespace 알림에만 걸려, 팀 Namespace 알림이 오지 않는다.
#   3) webhook 주소 Secret keepgo-alert-discord(키 url)는 사람이 만든다(Git에 두지 않음, 사용자 할 일).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: keepgo-services
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: keepgo
    release: kube-prometheus-stack
spec:
  route:
    receiver: discord
    # 같은 서비스·같은 알림은 묶어서 한 번에
    groupBy: [alertname, namespace, service]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      # keepgo-app 차트가 만든 알림만(이름이 Keepgo로 시작)
      - name: alertname
        matchType: "=~"
        value: "Keepgo.*"
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: keepgo-alert-discord
            key: url
          sendResolved: true
          # 제목: 🔴 발생 / ✅ 해제 + 알림 이름 + namespace/service(플랫폼 알림은 component)
          title: '{{ if eq .Status "firing" }}🔴 발생{{ else }}✅ 해제{{ end }} {{ .CommonLabels.alertname }} · {{ with .CommonLabels.namespace }}{{ . }}/{{ end }}{{ or .CommonLabels.service .CommonLabels.component "" }}'
          # 본문(11-11 개선, A):
          #   알림마다  요약(지금 값·기준값) · 심각도 · 시작 시각(KST, 해제면 해제 시각)
          #   묶음 공통 먼저 볼 것(description) + Grafana 링크(트레이스·로그·대시보드, 차트의 alerts.links)
          #   같은 서비스·같은 알림끼리 묶이므로(groupBy) 링크는 한 번만 붙인다(Discord 본문 4096자 제한)
          message: |-
            {{ range .Alerts }}{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} **{{ .Annotations.summary }}**
            심각도 `{{ .Labels.severity }}` · 시작 {{ .StartsAt | tz "Asia/Seoul" | date "01-02 15:04:05" }} KST{{ if eq .Status "resolved" }} · 해제 {{ .EndsAt | tz "Asia/Seoul" | date "15:04:05" }}{{ end }}
            {{ end }}{{ if eq .Status "firing" }}{{ with .CommonAnnotations.description }}
            🔎 **먼저 볼 것**: {{ . }}
            {{ end }}{{ if or .CommonAnnotations.trace_url .CommonAnnotations.logs_url .CommonAnnotations.dashboard_url }}
            {{ with .CommonAnnotations.trace_url }}🧵 [트레이스 (X-Ray, 오류·느린 요청)]({{ . }})
            {{ end }}{{ with .CommonAnnotations.logs_url }}📜 [로그 (ERROR·예외, trace_id 포함)]({{ . }})
            {{ end }}{{ with .CommonAnnotations.dashboard_url }}📊 [서비스 대시보드]({{ . }})
            {{ end }}_링크는 Grafana port-forward(3000:80)를 켠 상태에서 열립니다_{{ end }}{{ end }}
