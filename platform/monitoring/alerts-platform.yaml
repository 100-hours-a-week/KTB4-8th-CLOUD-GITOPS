# 플랫폼(인프라) 알림. 소유 A. 앱 알림(재시작·OOM·5xx·p95)은 keepgo-app 차트가 서비스마다 만든다(B).
# 이름이 Keepgo로 시작하므로 alertmanager-config.yaml(keepgo-services) 경로로 Discord에 간다. severity·component 라벨로 구분
# 각 알림의 description에 "먼저 볼 것"을 적었다(대응 절차의 첫 단계)
# dashboard_url: Discord 메시지의 링크(https://dev3.keepgo.kr/grafana). 같은 묶음(알림 이름·Namespace) 안에서 값이 같아야 메시지에 나오므로 파드·노드가 아니라 Namespace·전체 단위 화면으로 연결한다
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keepgo-platform
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: keepgo
spec:
  groups:
    - name: keepgo-platform.nodes
      rules:
        - alert: KeepgoPlatformNodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 5m
          labels: { severity: critical, component: node }
          annotations:
            summary: "노드 {{ $labels.node }}가 5분 넘게 NotReady"
            description: "먼저 볼 것: kubectl describe node {{ $labels.node }} (Conditions·Events). Karpenter 노드면 NodeClaim 상태, System 노드면 MNG 상태"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/058020e04168bfdea0c52269cb699df2?orgId=1&from=now-1h&to=now"
        - alert: KeepgoPlatformNodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 5m
          labels: { severity: warning, component: node }
          annotations:
            summary: "노드 {{ $labels.node }} 메모리 압박(파드 축출 가능)"
            description: "먼저 볼 것: kubectl top pods -A --sort-by=memory 로 그 노드의 큰 파드. System 노드면 requests 합계도 확인"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/058020e04168bfdea0c52269cb699df2?orgId=1&from=now-1h&to=now"

    - name: keepgo-platform.workloads
      rules:
        - alert: KeepgoPlatformPodPending
          expr: max by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
          for: 10m
          labels: { severity: warning, component: scheduling }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}가 10분 넘게 Pending"
            description: "먼저 볼 것: kubectl describe pod (Events). 노드 부족이면 Karpenter 로그·NodePool limits, quota 초과면 ResourceQuota, PVC면 AZ"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/85a562078cdf77779eaa1add43ccec1e?orgId=1&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"
        # 플랫폼 컴포넌트만(앱은 keepgo-app 차트 알림이 맡는다). 11-10 Argo CD 컨트롤러 CrashLoop 같은 경우
        - alert: KeepgoPlatformComponentCrashLooping
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace=~"argocd|monitoring|logging|tracing|kube-system|keda|karpenter|external-secrets|chaos-mesh|data"}) == 1
          for: 5m
          labels: { severity: critical, component: platform }
          annotations:
            summary: "플랫폼 컴포넌트 {{ $labels.namespace }}/{{ $labels.pod }}({{ $labels.container }}) CrashLoopBackOff"
            description: "먼저 볼 것: kubectl logs --previous, kubectl describe pod의 Last State(OOMKilled면 메모리 한도). Argo CD 컨트롤러면 동기화가 전부 멈춘다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/85a562078cdf77779eaa1add43ccec1e?orgId=1&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"
        - alert: KeepgoPlatformComponentOOMKilled
          expr: |
            max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace=~"argocd|monitoring|logging|tracing|kube-system|keda|karpenter|external-secrets|chaos-mesh|data"}) == 1
              and on (namespace, pod, container)
            increase(kube_pod_container_status_restarts_total[15m]) > 0
          labels: { severity: warning, component: platform }
          annotations:
            summary: "플랫폼 컴포넌트 {{ $labels.namespace }}/{{ $labels.pod }}({{ $labels.container }})가 메모리 부족으로 재시작"
            description: "먼저 볼 것: 그 컨테이너의 메모리 사용 추이와 limits. 반복되면 한도 상향(예: 11-10 Argo CD 768Mi→1536Mi)"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/85a562078cdf77779eaa1add43ccec1e?orgId=1&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"

    - name: keepgo-platform.storage
      rules:
        - alert: KeepgoPlatformPVCFillingUp
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.8
          for: 10m
          labels: { severity: warning, component: storage }
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 사용률 {{ $value | humanizePercentage }}"
            description: "먼저 볼 것: Prometheus면 retentionSize(15GB)와 PVC(20Gi), Redis면 AOF·RDB 크기. StorageClass가 allowVolumeExpansion이라 PVC 용량을 늘릴 수 있다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/919b92a8e8041bd567af9edab12c840c?orgId=1&var-namespace={{ $labels.namespace }}&from=now-1h&to=now"

    # Argo CD 자체 감시(11-12). 지표는 kube-prometheus-stack values의 PodMonitor argocd가 모은다(controller 8082·repo-server 8084)
    # Argo CD Notifications(Discord)는 컨트롤러가 살아 있어야 보내지므로, 컨트롤러가 멈춘 경우는 여기서만 잡힌다
    - name: keepgo-platform.gitops
      rules:
        # 11-10 OOM처럼 컨트롤러가 없거나 지표를 못 내는 경우. 이때는 Git에 머지해도 아무것도 반영되지 않는다
        - alert: KeepgoPlatformArgoCDControllerDown
          expr: absent(up{namespace="argocd", pod=~"argocd-application-controller-.*"} == 1)
          for: 5m
          labels: { severity: critical, component: gitops }
          annotations:
            summary: "Argo CD 컨트롤러가 5분 넘게 응답 없음 — Git 변경이 클러스터에 반영되지 않는 중"
            description: "먼저 볼 것: kubectl -n argocd get pod argocd-application-controller-0, describe의 Last State(OOMKilled면 argocd/bootstrap/values.yaml 메모리 → helm upgrade → StatefulSet이라 옛 Pod는 직접 삭제)"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22up%7Bnamespace%3D%5C%22argocd%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        # 컨트롤러는 떠 있는데 일을 안 하는 경우(멈춤·교착). 평소에는 앱마다 2분(reconciliation)에 한 번 이상 비교한다
        - alert: KeepgoPlatformArgoCDReconcileStalled
          expr: sum(increase(argocd_app_reconcile_count[15m])) == 0
          for: 5m
          labels: { severity: critical, component: gitops }
          annotations:
            summary: "Argo CD 컨트롤러가 20분 동안 어떤 앱도 비교하지 않음 — 살아 있지만 멈춘 상태"
            description: "먼저 볼 것: kubectl -n argocd logs argocd-application-controller-0 --tail=100 (context deadline·OOM 직전 로그), workqueue 지표(argocd_app_*). 풀리지 않으면 Pod 삭제로 재시작"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22sum%20by%20%28name%29%20%28increase%28argocd_app_reconcile_count%5B15m%5D%29%29%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        # 자동 동기화(selfHeal)인데 30분 넘게 Synced가 아니면 반영이 막힌 것. Unknown은 Git·차트 읽기 실패(ComparisonError)
        - alert: KeepgoPlatformArgoCDAppOutOfSync
          expr: max by (name, sync_status) (argocd_app_info{sync_status!="Synced"}) == 1
          for: 30m
          labels: { severity: warning, component: gitops }
          annotations:
            summary: "Argo CD 앱 {{ $labels.name }}이 30분 넘게 {{ $labels.sync_status }}"
            description: "먼저 볼 것: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{.status.conditions}' (ComparisonError·SyncError), .status.operationState.message. 재시도 5번이 끝났으면 다음 커밋 전까지 다시 시도하지 않는다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22argocd_app_info%7Bsync_status%21%3D%5C%22Synced%5C%22%7D%20or%20argocd_app_info%7Bhealth_status%21%3D%5C%22Healthy%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        # Notifications의 Degraded 알림이 webhook 문제로 안 가도 Alertmanager 경로로 한 번 더 받는다
        # 큐가 없어 ScaledObject가 TriggerError(Degraded)인 youtube-analysis-worker는 뺀다(KedaScalerErrors와 같이, 트리거를 정하면 지운다)
        - alert: KeepgoPlatformArgoCDAppUnhealthy
          expr: max by (name, health_status) (argocd_app_info{health_status=~"Degraded|Missing", name!="youtube-analysis-worker"}) == 1
          for: 15m
          labels: { severity: warning, component: gitops }
          annotations:
            summary: "Argo CD 앱 {{ $labels.name }}이 15분 넘게 {{ $labels.health_status }}"
            description: "먼저 볼 것: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{.status.resources}'에서 Healthy가 아닌 리소스, 그 리소스의 describe. 앱 Pod 문제면 서비스 알림(ReplicasUnavailable 등)도 함께 온다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22argocd_app_info%7Bsync_status%21%3D%5C%22Synced%5C%22%7D%20or%20argocd_app_info%7Bhealth_status%21%3D%5C%22Healthy%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
    - name: keepgo-platform.pipeline
      rules:
        - alert: KeepgoPlatformTargetDown
          expr: max by (namespace, job) (up) == 0
          for: 5m
          labels: { severity: warning, component: monitoring }
          annotations:
            summary: "수집 대상 {{ $labels.namespace }}/{{ $labels.job }}이 5분 넘게 응답 없음"
            description: "먼저 볼 것: Prometheus Targets 화면의 lastError, 대상 파드 상태, NetworkPolicy가 monitoring Namespace를 막는지"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22up%20%3D%3D%200%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        # 큐가 없어 계속 실패하는 youtube-analysis-worker는 뺀다(트리거를 정하면 이 제외를 지운다)
        # KEDA 2.21 이름: keda_scaler_detail_errors_total(옛 keda_scaler_errors_total). namespace 라벨은 KEDA 파드 것이라 scaledObject로 묶는다
        - alert: KeepgoPlatformKedaScalerErrors
          expr: sum by (scaledObject) (rate(keda_scaler_detail_errors_total{scaledObject!="youtube-analysis-worker"}[5m])) > 0
          for: 10m
          labels: { severity: warning, component: autoscaling }
          annotations:
            summary: "KEDA {{ $labels.scaledObject }} 트리거 조회 실패"
            description: "먼저 볼 것: kubectl describe scaledobject (Events), Prometheus 쿼리를 직접 실행. 실패 중에는 CPU 트리거로만 확장된다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/d/keepgo-v3-scaling?orgId=1&from=now-1h&to=now"
        - alert: KeepgoPlatformLogShippingFailing
          expr: sum by (pod) (rate(fluentbit_output_retries_failed_total[5m])) > 0
          for: 10m
          labels: { severity: warning, component: logging }
          annotations:
            summary: "Fluent Bit {{ $labels.pod }}가 CloudWatch Logs로 보내지 못하고 버리는 중"
            description: "먼저 볼 것: kubectl logs -n logging {{ $labels.pod }} 의 [error], Pod Identity 연결(logging/fluent-bit), IAM 권한"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22sum%20by%20%28pod%29%20%28rate%28fluentbit_output_retries_failed_total%5B5m%5D%29%29%20or%20sum%20by%20%28pod%29%20%28rate%28fluentbit_output_proc_records_total%5B5m%5D%29%29%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        - alert: KeepgoPlatformTraceExportFailing
          # Collector 0.162 내부 지표는 _total 접미사가 없다(예: otelcol_receiver_accepted_spans). 첫 실패 때 생긴다
          expr: sum(rate(otelcol_exporter_send_failed_spans[5m])) > 0
          for: 10m
          labels: { severity: warning, component: tracing }
          annotations:
            summary: "OTel Collector가 X-Ray로 Span을 보내지 못하는 중"
            description: "먼저 볼 것: kubectl logs -n tracing deploy/otel-collector, Pod Identity 연결(tracing/otel-collector), X-Ray 쓰기 권한"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22sum%28rate%28otelcol_exporter_send_failed_spans%5B5m%5D%29%29%20or%20sum%28rate%28otelcol_receiver_accepted_spans%5B5m%5D%29%29%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
        - alert: KeepgoPlatformThanosUploadFailing
          expr: sum(increase(thanos_shipper_upload_failures_total[30m])) > 0
          labels: { severity: warning, component: monitoring }
          annotations:
            summary: "Thanos sidecar가 S3에 블록을 올리지 못함"
            description: "먼저 볼 것: Prometheus 파드의 thanos-sidecar 로그, Pod Identity 연결(monitoring/kube-prometheus-stack-prometheus), 버킷 권한. 실패한 블록은 다음 업로드 때 다시 시도한다"
            dashboard_url: "https://dev3.keepgo.kr/grafana/explore?schemaVersion=1&orgId=1&panes=%7B%22a%22%3A%7B%22datasource%22%3A%22prometheus%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22prometheus%22%2C%22uid%22%3A%22prometheus%22%7D%2C%22expr%22%3A%22sum%28increase%28thanos_shipper_uploads_total%5B2h%5D%29%29%20or%20sum%28increase%28thanos_shipper_upload_failures_total%5B2h%5D%29%29%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22%7D%7D%7D"
