# 직접 작성(scripts/gen-dashboards.py 대상 아님). 소유 A. CloudWatch 데이터 소스(uid cloudwatch, kube-prometheus-stack values)를 쓴다.
# ALB 이름은 Load Balancer Controller가 만든 값이라 Gateway를 다시 만들면 바뀐다 → 그때 LoadBalancer 값을 고친다.
