# OpenTelemetry Collector(open-telemetry/opentelemetry-collector 차트 0.176.1, collector-contrib 0.162.0) 설치 값. 소유 A.
# 앱(OTel Java Agent)이 보낸 Span을 받아 AWS X-Ray로 보낸다. 메트릭·로그는 받지 않는다(Prometheus·Fluent Bit 담당).
#
# [AWS 자격증명] EKS Pod Identity: tracing/otel-collector → IAM keepgo-dev3-otel-collector-role (AWSXRayDaemonWriteAccess)

mode: deployment
replicaCount: 1
# 앱이 보낼 주소를 짧게: http://otel-collector.tracing.svc.cluster.local:4318
fullnameOverride: otel-collector

image:
  # awsxray exporter는 contrib 배포판에만 있다
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  tag: "0.162.0"
command:
  name: otelcol-contrib

serviceAccount:
  create: true
  name: otel-collector

# 관리 컴포넌트라 System 노드(5-3 6.3)
nodeSelector: { workload: system }
tolerations:
  - { key: workload, operator: Equal, value: system, effect: NoSchedule }
priorityClassName: system-cluster-critical

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

# OTLP(4317 gRPC, 4318 HTTP)만 연다. 차트 기본의 jaeger·zipkin 포트는 끈다
ports:
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
  # Collector 자체 지표(보낸·실패한 Span 수, 큐). 아래 ServiceMonitor가 수집한다
  metrics: { enabled: true }

# 10단계 알림 KeepgoPlatformTraceExportFailing(otelcol_exporter_send_failed_spans_total)이 이 지표를 쓴다
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack

config:
  receivers:
    # 차트 기본 수신기 중 쓰지 않는 것을 지운다
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: { endpoint: "${env:MY_POD_IP}:4317" }
        http: { endpoint: "${env:MY_POD_IP}:4318" }
  processors:
    # 메모리 한도(256Mi)의 80%를 넘으면 새 데이터를 거절해 OOM을 막는다
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 20
    # ① 쓸모없는 구간을 버린다(11-10 측정: 15분 375건 중 헬스체크 195·부모 없는 DB 구간 168·실제 API 12)
    #   - 쿠버네티스 헬스체크(/actuator/health/…, 10초마다)
    #   - 요청 없이 생긴 DB 호출(커넥션 풀 점검 등): 부모가 없는 CLIENT 구간
    filter/noise:
      error_mode: ignore
      traces:
        span:
          - 'IsMatch(attributes["url.path"], "^/actuator")'
          - 'IsRootSpan() and kind == SPAN_KIND_CLIENT'
    # ② 요청 하나(Trace)가 끝날 때까지 모았다가 저장 여부를 정한다. 셋 중 하나라도 해당하면 저장
    #   오류는 전부, 2초 넘게 느린 요청은 전부, 나머지는 10%. Trace 단위로 모아야 해서 Collector는 1개여야 한다
    tail_sampling:
      decision_wait: 10s
      num_traces: 20000
      policies:
        - name: errors
          type: status_code
          status_code: { status_codes: [ERROR] }
        - name: slow
          type: latency
          latency: { threshold_ms: 2000 }
        - name: rest-10pct
          type: probabilistic
          probabilistic: { sampling_percentage: 10 }
  exporters:
    debug: null
    awsxray:
      region: ap-northeast-2
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/noise, tail_sampling, batch]
        exporters: [awsxray]
      metrics: null
      logs: null
