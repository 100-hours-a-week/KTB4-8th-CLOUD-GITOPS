# Spring 서비스 dev 공통. auto-release-dev(scripts/release.py)가 image.tag를 이 파일에 커밋한다.
image:
  # V2 운영 backend 이미지로 시작한다. auto-release-dev가 KTB4-8th-BE develop 이미지로 바꾼다.
  tag: "1681ef9f01610be700cc4621d7126dbd4b939a12"

env:
  # dev3 RDS keepgo-dev3-mysql(dice 소유, Data 서브넷, MySQL 8.4, DB keepgo)
  DB_HOST: keepgo-dev3-mysql.c9c2syg08nfm.ap-northeast-2.rds.amazonaws.com
  # [가정] Redis StatefulSet(A 소유)이 data Namespace의 redis Service
  REDIS_HOST: redis.data.svc.cluster.local
  FRONTEND_SERVER_ADDRESS: https://dev3.keepgo.kr
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECTURI: https://dev3.keepgo.kr/login/oauth2/code/google
  # [가정] dev3 업로드 버킷
  FILE_STORAGE_S3_BUCKET: keepgo-dev3-uploads
  # [가정] dev3 SQS 큐(A 소유). 앱에 SQS 코드가 생기면 읽는다.
  SQS_ANALYSIS_QUEUE_URL: https://sqs.ap-northeast-2.amazonaws.com/602601433533/keepgo-dev3-youtube-analysis

# [가정] Secrets Manager 경로. 키 이름은 V2 Secret-v1-BE·RDS 관리 Secret과 같다.
externalSecrets:
  items:
    - name: env
      asEnv: true
      # keepgo/dev3/backend의 키를 통째로 환경변수로 넣는다(V2와 같음). 개발팀이 키를 추가해도 values를 고치지 않는다.
      dataFrom:
        - extract: { key: keepgo/dev3/backend }
      # DB 계정은 RDS 관리 Secret의 키 이름(username·password)이 달라 골라서 넣는다. data가 dataFrom보다 나중에 적용된다.
      data:
        - { secretKey: DB_USERNAME, remoteRef: { key: keepgo/dev3/rds, property: username } }
        - { secretKey: DB_PASSWORD, remoteRef: { key: keepgo/dev3/rds, property: password } }
    - name: jwt
      asFiles:
        mountPath: /run/secrets/jwt
        items:
          - { key: JWT_PUBLIC_KEY, path: jwt_public_key.pem }
          - { key: JWT_PRIVATE_KEY, path: jwt_private_key.pem }
      data:
        - { secretKey: JWT_PUBLIC_KEY, remoteRef: { key: keepgo/dev3/backend, property: JWT_PUBLIC_KEY } }
        - { secretKey: JWT_PRIVATE_KEY, remoteRef: { key: keepgo/dev3/backend, property: JWT_PRIVATE_KEY } }

# partA Gateway
httpRoute:
  parentRefs:
    - { name: keepgo-dev3-gateway, namespace: gateway-system, sectionName: https }
  hostnames:
    - dev3.keepgo.kr

networkPolicy:
  # dev3-public-a·c(ALB가 놓인 서브넷)
  gatewayCIDRs: [10.47.0.0/24, 10.47.1.0/24]

metrics:
  # [가정] kube-prometheus-stack 릴리스 이름(A 설치)
  podMonitorLabels:
    release: kube-prometheus-stack

# 알림 메시지의 Grafana 링크(트레이스·로그·대시보드). Grafana는 https://dev3.keepgo.kr/grafana (GitHub 로그인, ktb4-8th 팀)
alerts:
  links:
    grafanaUrl: https://dev3.keepgo.kr/grafana
    logGroupPrefix: /aws/eks/keepgo-dev3
