# Spring 7개 서비스 공통(환경 무관). 값의 근거는 V2 ECS 설정(infrastructure/terraform-v2/services.tf)과 5-3.
component: api

image:
  # V2와 같은 ECR 저장소. dev에서 검증한 이미지를 prod에 그대로 올린다(5-4 5.2).
  repository: 602601433533.dkr.ecr.ap-northeast-2.amazonaws.com/keepgo-backend

probes:
  preset: spring

env:
  # Tomcat 스레드·연결 지표(tomcat_threads_busy_threads 등)를 Actuator로 낸다. 코드 변경 없음
  SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
  # 기존 힙 설정(차트 기본값)을 유지하고 agent를 뒤에 붙인다. 덮어쓰면 힙이 기본값(25%)으로 돌아간다
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -javaagent:/otel/javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.tracing.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # 앱은 전부(1.0) 보내고, 무엇을 남길지는 Collector가 정한다(platform/otel-collector: 헬스체크 제외,
  # 오류·2초 이상 전부, 나머지 10%). 여기서 낮추면 오류 트레이스까지 같은 비율로 버려진다
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  # 메트릭은 Prometheus, 로그는 Fluent Bit가 맡으므로 agent로는 보내지 않는다
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev3,service.namespace=keepgo
  # 로그를 JSON(ECS)으로. agent가 넣은 trace_id·span_id가 필드로 들어가 Logs Insights에서 검색된다
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  DB_VENDOR: mysql
  DB_PORT: "3306"
  DB_NAME: keepgo
  DB_TIMEZONE: Asia/Seoul
  DB_DRIVER: com.mysql.cj.jdbc.Driver
  DB_DIALECT: MySQL
  # Pod당 DB 커넥션 수. 기본 10을 쓰지 않는다(5-3 3.4). 예산 계산은 gitops/scripts/check-budget.py
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
  # 연결을 얻을 때까지 기다리는 최대 시간(ms). 기본 30000.
  # 11-12 S5 실험: DB 0.3초 지연에 요청마다 30초씩 줄을 서서 대기 199개, p95 58초까지 커졌다.
  # 3초 안에 못 얻으면 바로 실패시켜 줄이 끝없이 길어지지 않게 하고, DB가 회복되면 곧바로 정상으로 돌아오게 한다.
  SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "3000"
  # V2와 같은 스키마 관리 방식. backend에 Flyway 스크립트가 생기면 migration Job으로 옮기고 이 값을 바꾼다(5-4 8.3).
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "1"
  SPRING_SQL_INIT_MODE: always
  SPRING_SQL_INIT_CONTINUE_ON_ERROR: "true"
  # 클러스터 안 ai-api(ai Namespace). V2는 Cloud Map 주소였다.
  AI_SERVER_API_ADDRESS: http://ai-api.ai.svc.cluster.local:8000
  SPRING_SERVLET_MULTIPART_MAXFILESIZE: 10MB
  SPRING_SERVLET_MULTIPART_MAXREQUESTSIZE: 10MB
  # JWT 키는 ExternalSecret(jwt)을 파일로 붙인다.
  KEEPGO_SECURITY_JWT_PUBLICKEY: file:/run/secrets/jwt/jwt_public_key.pem
  KEEPGO_SECURITY_JWT_PRIVATEKEY: file:/run/secrets/jwt/jwt_private_key.pem
  # 채팅 요청 상태를 Pod 메모리가 아니라 Redis에 둔다(여러 Pod·SSE 재연결, 5-3 2.4).
  EPHEMERAL_DATABASE: redis
  REDIS_PORT: "6379"
  # 클러스터 안 Redis StatefulSet은 TLS 없이 쓴다(ElastiCache와 다름).
  REDIS_SSL_ENABLED: "false"
  # 업로드를 Pod 디스크가 아니라 S3에 둔다. 로컬 저장은 Pod가 여러 개면 파일이 흩어진다.
  FILE_STORAGE_PROVIDER: s3
  FILE_STORAGE_S3_REGION: ap-northeast-2

# 앱 Pod는 Application NodePool(On-Demand)에만(partA NodePool 라벨). worker는 서비스 values에서 바꾼다.
nodeSelector:
  workload: application

# [6단계 트레이스] OTel Java Agent. 앱 코드 변경 없이 HTTP·JDBC·Redis·HTTP 클라이언트 구간을 자동 기록한다.
# agent jar는 이미지에 없으므로 initContainer가 공용 이미지에서 꺼내 emptyDir(/otel)에 복사한다.
extraVolumes:
  - { name: otel-agent, mountPath: /otel, sizeLimit: 64Mi }
initContainers:
  - name: otel-agent
    # opentelemetry-java-instrumentation v2.32.0(10-03 배포)을 담은 공식 이미지
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.32.0
    command: ["cp", "/javaagent.jar", "/otel/javaagent.jar"]
    volumeMounts:
      - { name: otel-agent, mountPath: /otel }
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: ["ALL"] }
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
extraEnv:
  # 서비스 이름 = Deployment 라벨(auth-api, chat-api …). X-Ray 서비스 맵에 이 이름으로 보인다
  - name: OTEL_SERVICE_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.labels['app.kubernetes.io/name']
