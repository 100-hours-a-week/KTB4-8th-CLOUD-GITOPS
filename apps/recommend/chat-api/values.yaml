# chat-api — 채팅·슬롯 추출 (SSE)
# 경로 근거: KTB4-8th-BE 컨트롤러(v2는 text/event-stream, 180초 타임아웃)
priorityClassName: keepgo-high

resources:
  requests:
    cpu: 300m
    memory: 1Gi
  limits:
    memory: 1Gi

# 종료(5-3 4.5 SSE): preStop 10초 동안 대상에서 빠지고, 앱이 재연결을 유도한 뒤 닫는다.
# 모든 연결이 끝날 때까지 기다리지 않는다. 클라이언트는 다른 Pod로 재연결해 Redis·RDS에서 상태를 복구한다.
terminationGracePeriodSeconds: 60
env:
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 45s

# 활성 SSE 연결 수로 확장(5-3 5.5). Scale-to-Zero는 쓰지 않는다.
# [사실] 앱 코드 변경 없이 쓰는 값: Spring이 진행 중인 HTTP 요청 수를 내는 http_server_requests_active_seconds_gcount.
#        SSE는 응답이 끝날 때까지(최대 180초) 진행 중으로 남아서 이 수의 대부분이 SSE 연결이다.
#        uri 라벨은 요청 시작 시점이라 항상 UNKNOWN이어서 경로로 거르지 않고 서비스 전체로 본다.
#        SSE가 없는 옛 이미지(503a236)에서는 거의 0이라 CPU 트리거만 동작한다.
autoscaling:
  type: keda
  keda:
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: sum(http_server_requests_active_seconds_gcount{namespace="recommend", app_kubernetes_io_name="chat-api"})
          # Pod 하나가 맡을 연결 수(가정). 연결당 메모리를 재고 정한다.
          threshold: "200"
          ignoreNullValues: "true"
      - type: cpu
        metricType: Utilization
        metadata:
          value: "70"
  # 줄일 때 그 Pod의 연결이 모두 끊기므로 천천히, 한 번에 하나씩(5-3 5.5)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - { type: Pods, value: 1, periodSeconds: 300 }

httpRoute:
  enabled: true
  pathPrefixes:
    - /api/v2/member/chat-messages
    - /api/v1/user/chat-messages
    # v3 채팅(글자 단위 스트림, BE ChatStreamController). 지금 FE는 v2를 쓰지만 v3로 바꿔도 member-api로 새지 않게
    - /api/v3/member/chat-messages
  targetGroup:
    # 빠질 때 기존 연결을 정리할 시간. 종료 상한(60초)보다 짧게.
    deregistrationDelaySeconds: 50

# 채팅 전송(SSE)은 응답 시간이 곧 답변 스트림 시간이라 p95 지연에서 뺀다(상태도 항상 200).
# 나머지(내역 조회·의도 카드 수정·초기화)는 일반 요청이라 기본 기준(p95 1초)으로 본다.
# 11-12 S5: 300초 하나로 두면 같은 서비스의 짧은 요청이 1분씩 걸려도 알림이 울리지 않았다.
alerts:
  http:
    latencyExcludeUris: "/api/v2/member/chat-messages|/api/v3/member/chat-messages"
