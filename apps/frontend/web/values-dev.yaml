image:
  # auto-release-dev가 KTB4-8th-FE develop 이미지로 바꾼다.
  # NEXT_PUBLIC_* 값은 이미지 빌드 때 들어가므로 dev·prod 이미지가 다를 수 있다(문서 참고).
  tag: "b21465f0e55054691bff9187e6c8e75d9816afa0"

autoscaling:
  minReplicas: 1
  maxReplicas: 2

httpRoute:
  parentRefs:
    - { name: keepgo-dev3-gateway, namespace: gateway-system, sectionName: https }
  hostnames:
    - dev3.keepgo.kr

networkPolicy:
  gatewayCIDRs: [10.47.0.0/24, 10.47.1.0/24]

# [가정] 서버 전용 키(BFF 라우트용). 키 이름은 FE .env.example
externalSecrets:
  items:
    - name: env
      asEnv: true
      dataFrom:
        - extract: { key: keepgo/dev3/web }

# Prometheus(kube-prometheus-stack)가 PodMonitor·PrometheusRule을 고르는 라벨. Spring은 _shared/spring-dev.yaml에 있다.
# 없으면 이 서비스의 재시작·OOM·Replica 알림을 Prometheus가 읽지 않는다.
metrics:
  podMonitorLabels:
    release: kube-prometheus-stack

# 알림 메시지의 Grafana 링크(트레이스·로그·대시보드). Grafana는 https://dev3.keepgo.kr/grafana (GitHub 로그인, ktb4-8th 팀)
alerts:
  links:
    grafanaUrl: https://dev3.keepgo.kr/grafana
    logGroupPrefix: /aws/eks/keepgo-dev3
