# 핵심 서비스: 최소 2개(AZ a·c 하나씩). 11-12 카오스 실험 결과로 1 → 2. 최대는 quota·DB 연결 예산 안에서 3
autoscaling:
  minReplicas: 2
  maxReplicas: 3

env:
  # 로그인과 YouTube OAuth의 임시 인증 요청을 dev3의 공용 Redis에 저장한다.
  # Google 토큰과 회원 데이터의 저장소는 이 설정의 영향을 받지 않는다.
  KEEPGO_SECURITY_OAUTH2_AUTHORIZATIONREQUEST_PROVIDER: redis
  KEEPGO_SECURITY_OAUTH2_AUTHORIZATIONREQUEST_FAILUREURL: https://dev3.keepgo.kr/login
